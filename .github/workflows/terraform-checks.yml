name: Terraform Checks

# This workflow only reads the repo (checkout, fmt, validate) - it never
# needs to write anything back via the GITHUB_TOKEN, so scope it down from
# the default (broader) token permissions instead of leaving it implicit.
permissions:
  contents: read

on:
  # Manual "Build Now" button - Actions tab -> this workflow -> Run
  # workflow. Same reasoning as build-push-images.yml: re-trigger on
  # demand without a throwaway commit to satisfy a path filter.
  workflow_dispatch:
  pull_request:
    paths:
      - "IaC/terraform/**"
      - "IaC/terraform-ecr-repos/**"
  push:
    branches: [main]
    paths:
      - "IaC/terraform/**"
      - "IaC/terraform-ecr-repos/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    # Two independent Terraform roots (separate state, separate providers.tf)
    # - IaC/terraform (ephemeral cluster stack) and IaC/terraform-ecr-repos
    # (the persistent one). Same steps for both, just a different
    # working-directory - a matrix avoids duplicating the whole job.
    strategy:
      matrix:
        working_directory:
          - IaC/terraform
          - IaC/terraform-ecr-repos

    defaults:
      run:
        working-directory: ${{ matrix.working_directory }}

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # -backend=false: validate only needs provider schemas, not real
      # state, so this needs no AWS credentials for either root - even
      # terraform-ecr-repos, despite its real S3 backend normally.
      - name: terraform init
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      # Catches Terraform-specific mistakes validate doesn't: unused
      # variables, deprecated syntax, invalid values for this provider.
      # One shared .tflint.hcl at repo root - --config with an absolute
      # path works regardless of which matrix leg's working-directory
      # we're in.
      - uses: terraform-linters/setup-tflint@v6
        with:
          cache: true

      - name: tflint --init
        run: tflint --init --config "${{ github.workspace }}/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint
        run: tflint --config "${{ github.workspace }}/.tflint.hcl"

      # Checks the actual resource configurations for real security
      # misconfigurations (open security groups, missing encryption,
      # overly-broad IAM) - the thing validate/fmt/tflint can't see,
      # since they only judge syntax and Terraform-specific correctness.
      # config_file points at the repo-root .checkov.yaml (skip-list with
      # reasons) regardless of which matrix leg's working-directory we're
      # in - same pattern as tflint's --config above.
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ matrix.working_directory }}
          framework: terraform
          quiet: true
          config_file: ${{ github.workspace }}/.checkov.yaml
