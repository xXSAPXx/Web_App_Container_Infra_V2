name: "[Repo] K8s Manifest Checks"

# Static checks on k8s/ - nothing here talks to a cluster. Read-only, so
# the token only needs to check the repo out.
permissions:
  contents: read

# Keyed on branch/PR so a new push cancels whatever's still running for
# that same ref - same reasoning as the other workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # Manual "Build Now" button - same reasoning as the other workflows.
  workflow_dispatch:
  pull_request:
    paths:
      - "k8s/**"
  push:
    branches: [main]
    paths:
      - "k8s/**"

# Both tools are downloaded as release binaries, pinned by version AND
# sha256 of the release archive - the binary equivalent of pinning actions
# to commit SHAs. sha256sum -c fails the step before extraction if the
# download differs by even one byte. Dependabot doesn't track these, so
# bump version + hash together by hand (hash = the release's own checksums
# file, verified against a download).
env:
  KUBERNETES_VERSION: "1.34.0" # schema version kubeconform validates against - keep in sync with the cluster
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  KUBE_SCORE_VERSION: "1.20.0"
  KUBE_SCORE_SHA256: "ff777b4b3f45905b2d22c69e93c57a7a170e61529a79d54e59cb95cca4bc2a55"

jobs:
  # Schema validation - catches typos, wrong indentation and fields in the
  # wrong place before they ever reach kubectl apply. -strict also rejects
  # unknown fields, which Kubernetes would otherwise silently drop.
  kubeconform:
    name: kubeconform (schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install kubeconform
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform

      - name: kubeconform
        run: |
          "$RUNNER_TEMP/kubeconform" -strict -summary \
            -kubernetes-version "${KUBERNETES_VERSION}" k8s/

  # Best-practice checks (PDBs, probes, resources, security context,
  # network policies, ...). Fails the job on any CRITICAL finding;
  # WARNINGs are printed but don't fail it. No checks are ignored.
  kube-score:
    name: kube-score (best practices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install kube-score
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kube-score.tar.gz" \
            "https://github.com/zegl/kube-score/releases/download/v${KUBE_SCORE_VERSION}/kube-score_${KUBE_SCORE_VERSION}_linux_amd64.tar.gz"
          echo "${KUBE_SCORE_SHA256}  $RUNNER_TEMP/kube-score.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kube-score.tar.gz" -C "$RUNNER_TEMP" kube-score

      # All files in one run, so cross-object checks work (a Deployment is
      # matched against its PDB, Service and NetworkPolicy).
      - name: kube-score
        run: |
          "$RUNNER_TEMP/kube-score" score --output-format ci k8s/*.yaml
