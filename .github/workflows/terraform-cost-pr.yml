name: "[Repo] Terraform Cost - PR Difference"

# PR half of the Infracost setup - main's baseline upload lives in
# terraform-cost-main.yml. Split per event so neither job shows up as
# "skipped" on the other's runs.
#
# contents: read is just for checkout. pull-requests: write is only
# needed by the job below to post/update the cost comment. No AWS
# credentials needed - Infracost prices resources by statically parsing
# the HCL against its own pricing catalog (same as Checkov statically
# parsing it for security issues), it never touches real state or needs
# cloud auth, even for the S3-backed root.
permissions:
  contents: read

# Keyed on branch/PR so a new push cancels whatever's still running for
# that same ref - safe since this workflow only estimates cost, it never
# changes anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No workflow_dispatch - the job needs a real PR to comment on. Paths
# must stay in sync with terraform-cost-main.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "IaC/terraform/**"
      - "IaC/terraform-ecr-repos/**"
      - "infracost.yml"

jobs:
  # Posts/updates the PR comment with the cost diff between base and head.
  # infracost.yml at the repo root tells this which two directories are
  # separate projects, so one comment covers both - no matrix needed.
  diff:
    name: Infracost cost difference vs baseline
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      # Skipped on the "closed" event - there's no new diff to compute
      # when a PR merges/closes, this run just needs to reach the diff
      # action below so it can mark the PR closed on Infracost's side.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event.action != 'closed'
        with:
          path: head
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event.action != 'closed'
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
          persist-credentials: false

      # version pins the scanner binary the action downloads at runtime -
      # the SHA above only pins the action's wrapper, and its default
      # ("latest") would pull whatever Infracost released most recently.
      - uses: infracost/actions/diff@fb736a8f219195d6efdca58682069b16fe1bc280 # v4
        with:
          version: 0.2.10
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          base-path: base
          head-path: head
