name: "[Repo] Build & Push to ECR"

on:
  # Manual "Build Now" button - Actions tab -> this workflow -> Run
  # workflow. Lets you re-trigger a real run (e.g. to pick up a CI-only
  # fix) without needing a throwaway commit to backend/**/frontend/** just
  # to satisfy the push trigger's path filter.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"

# id-token: write is what lets this workflow request an OIDC token from
# GitHub at all - without it, the AWS credentials step below has nothing
# to hand AWS, regardless of the IAM role's trust policy being correct.
permissions:
  id-token: write
  contents: read

# Keyed on branch/PR so two runs on the same ref never push to ECR at the
# same time - but cancel-in-progress stays false, unlike the read-only
# workflows: this one actually pushes image layers, so cancelling a run
# mid-push could leave a half-uploaded/corrupt tag. A second run just
# queues behind the first instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest

    # One job definition, run twice with different inputs - avoids writing
    # near-identical steps for frontend and backend separately.
    strategy:
      matrix:
        include:
          - service: frontend
            dockerfile_dir: frontend
            ecr_repo: calc-app-frontend
            run_tests: false
          - service: backend
            dockerfile_dir: backend
            ecr_repo: calc-app-backend
            run_tests: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # backend/Dockerfile has a "test" stage (RUN npm run test) that
      # nothing was ever targeting - the regular build below only builds
      # the last stage (production) by default, so tests never actually
      # ran in CI. This targets that stage directly: no push, no load,
      # the point is just that RUN npm run test either exits 0 or fails
      # the build. Runs first - fail fast before wasting time on a build/
      # scan of code whose tests don't even pass. frontend has no test
      # framework (static Apache site), hence run_tests being per-service.
      - name: Run tests
        if: matrix.run_tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.dockerfile_dir }}
          target: test
          push: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # GITHUB_SHA is the full 40-char commit SHA - not something anyone
      # wants to type/read, so this trims it the same way GitHub's own UI
      # displays short SHAs.
      - name: Set short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Built locally first (push: false, load: true) so it can be scanned
      # before anything reaches ECR - a real gate, not just an after-the-
      # fact report. If we pushed first and scanned after, a vulnerable
      # image would already be sitting in the registry by the time Trivy
      # even ran.
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.dockerfile_dir }}
          push: false
          load: true
          tags: local/${{ matrix.ecr_repo }}:scan

      - name: Scan ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.ecr_repo }}:scan
          exit-code: "1"
          # HIGH findings on the base OS layer (Alpine packages, not our
          # own code) are common and resolve on Alpine's own patch
          # timeline - blocking on those specifically was noisy (2 on
          # backend, 22 on frontend, first real run). CRITICAL only for
          # now; revisit once Dependabot's docker-ecosystem bumps + a
          # retry have cleared the current backlog.
          severity: "CRITICAL"

      # Two tags on the same image, not a choice between them: v<run
      # number> is what you'd reference in conversation/dashboards
      # (auto-incrementing, not semantic - just "the Nth build"), the
      # short SHA is what a rollback would actually key off of, since
      # it's traceable back to an exact commit and never gets reused.
      # Rebuilding here is a docker layer-cache hit, not a real rebuild -
      # nothing changed since the first build above.
      - name: Push ${{ matrix.service }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.dockerfile_dir }}
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ matrix.ecr_repo }}:v${{ github.run_number }}
            ${{ steps.ecr-login.outputs.registry }}/${{ matrix.ecr_repo }}:${{ steps.vars.outputs.short_sha }}
