version: 2

# cooldown on every ecosystem: Dependabot waits 7 days after a release
# before proposing it, so a hijacked/malicious release is usually yanked
# before it ever reaches a PR here. Security updates bypass cooldown, so
# CVE fixes still arrive immediately.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Real application dependencies - one entry per directory with its own
  # package.json, npm treats each as an independent project.
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Base image tags pinned in each Dockerfile (node:24-alpine,
  # httpd:2.4-alpine) - directory is wherever the Dockerfile itself lives,
  # same convention as npm above.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Provider version constraints (hashicorp/aws ~> 6.63, etc.) in each of
  # the two independent Terraform roots - same reasoning as
  # terraform-checks.yml treating them as separate matrix legs.
  - package-ecosystem: "terraform"
    directory: "/IaC/terraform"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "terraform"
    directory: "/IaC/terraform-ecr-repos"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
