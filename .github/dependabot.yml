version: 2

# cooldown on every ecosystem: Dependabot waits 7 days after a release
# before proposing it, so a hijacked/malicious release is usually yanked
# before it ever reaches a PR here. Security updates bypass cooldown, so
# CVE fixes still arrive immediately.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Real application dependencies - backend only. The frontend is a
  # static httpd site with no npm dependencies; its base image is covered
  # by the docker entry below.
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Upstream FROM lines of the trusted base images - a merged bump
  # triggers curate-base-images.yml, which publishes a new trusted image.
  # backend/ and frontend/ Dockerfiles aren't watched: they build FROM the
  # private trusted_base_images repo (pinned tag + digest), which
  # Dependabot can't read - their bumps are PRs after each curation run.
  - package-ecosystem: "docker"
    directories: ["/base-images/httpd", "/base-images/node"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Provider version constraints (hashicorp/aws ~> 6.63, etc.) in each of
  # the two independent Terraform roots - same reasoning as
  # terraform-checks.yml treating them as separate matrix legs.
  - package-ecosystem: "terraform"
    directory: "/IaC/terraform-app-stack"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "terraform"
    directory: "/IaC/terraform-ecr-repos"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
