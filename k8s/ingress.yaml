# One ALB, two Ingress objects merged via group.name (IngressGroup) so the
# frontend and backend target groups can each get their own health check.
# Without group.name these would each provision a SEPARATE ALB.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: calc-app
  annotations:
    alb.ingress.kubernetes.io/group.name: calc-app
    alb.ingress.kubernetes.io/group.order: "10" # Evaluated before the frontend's catch-all "/"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Replace with the value of `terraform output acm_certificate_arn`.
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_WITH_ACM_CERTIFICATE_ARN
    alb.ingress.kubernetes.io/healthcheck-path: /backend
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /calculator/api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: calc-app
  annotations:
    alb.ingress.kubernetes.io/group.name: calc-app
    alb.ingress.kubernetes.io/group.order: "20" # Catch-all, evaluated after the backend's more specific path
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_WITH_ACM_CERTIFICATE_ARN
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
