# One ALB, two Ingress objects merged via group.name (IngressGroup) so the
# frontend and backend target groups can each get their own health check.
# Without group.name these would each provision a SEPARATE ALB.
#
# Rendered from terraform output by IaC/deploy-app.sh - don't kubectl apply
# this file directly, run that script instead.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: calc-app
  annotations:
    alb.ingress.kubernetes.io/group.name: calc-app
    alb.ingress.kubernetes.io/group.order: "10" # Evaluated before the frontend's catch-all "/"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: ${ACM_CERT_ARN}
    alb.ingress.kubernetes.io/healthcheck-path: /backend
    # Service tag for this IngressGroup's ALB and target groups (the common
    # tags come from the controller's defaultTags - see helm_release
    # .aws_load_balancer_controller). Must be identical on every member of
    # the group: tags from all members merge onto the one shared ALB, and
    # conflicting values stop the controller reconciling it.
    alb.ingress.kubernetes.io/tags: Service=calc-app
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /calculator/api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: calc-app
  annotations:
    alb.ingress.kubernetes.io/group.name: calc-app
    alb.ingress.kubernetes.io/group.order: "20" # Catch-all, evaluated after the backend's more specific path
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: ${ACM_CERT_ARN}
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/tags: Service=calc-app # must match backend-ingress - see the note there
    # external-dns reads this to create/update the Cloudflare record
    # automatically once the ALB Controller populates this Ingress's
    # status.loadBalancer hostname. Only set on this Ingress (not the
    # backend one too) since both share the same ALB - one record per host
    # is enough.
    #
    # www only - NOT the bare apex. external-dns's TXT-registry ownership
    # scheme breaks for zone-apex CNAMEs (its "cname-<hostname>" ownership
    # record collapses to "cname-xxsapxx.uk" with no separating dot, fails
    # its own zone-suffix match, and retries forever without ever
    # converging). The apex is instead a plain static CNAME to
    # www.xxsapxx.uk, managed directly in modules/cloudflare - see the note
    # there for why.
    external-dns.alpha.kubernetes.io/hostname: www.xxsapxx.uk
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
