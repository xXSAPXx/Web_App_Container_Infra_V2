apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: calc-app
data:
  # Rendered from terraform output by IaC/deploy-app.sh - don't kubectl
  # apply this file directly, run that script instead.
  DB_HOST: "${DB_HOST}"
  DB_PORT: "3306"
  DB_NAME: "calc_app_db"
  DB_CONNECTION_LIMIT: "10"
