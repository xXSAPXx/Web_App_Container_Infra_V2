apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: calc-app
data:
  # DB_HOST is a stable Terraform-managed DNS name (see
  # modules/database/main.tf), not the RDS instance's own raw endpoint -
  # that changes every session since a fresh restore gets a fresh
  # AWS-generated hostname. Fixed value, no templating needed here.
  DB_HOST: "mysql-db.internal.xxsapxx.local"
  DB_PORT: "3306"
  DB_NAME: "CALC_APP_DB"
  DB_CONNECTION_LIMIT: "10"
