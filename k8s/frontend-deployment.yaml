apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: calc-app
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Replace with the value of `terraform output ecr_frontend_repository_url`,
          # after you've built and pushed the image (see frontend/Dockerfile).
          image: "REPLACE_WITH_ECR_FRONTEND_REPOSITORY_URL:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
