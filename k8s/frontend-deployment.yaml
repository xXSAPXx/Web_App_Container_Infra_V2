apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: calc-app
  labels:
    app: frontend
spec:
  replicas: 2
  minReadySeconds: 10                              # new pod must stay Ready 10s before the rollout moves on - catches pods that crash right after starting
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1                               # replica count per node may differ by at most 1
          topologyKey: kubernetes.io/hostname      # spread across nodes
          whenUnsatisfiable: DoNotSchedule         # hard rule - never put both replicas on one node
          nodeTaintsPolicy: Honor                  # ignore cordoned nodes, so a drained pod can still reschedule
          matchLabelKeys: [pod-template-hash]      # count per ReplicaSet revision, so rollout surge pods aren't blocked
          labelSelector:
            matchLabels:
              app: frontend                        # which pods to spread
        - maxSkew: 1                               # replica count per AZ may differ by at most 1
          topologyKey: topology.kubernetes.io/zone # spread across AZs - the node rule alone allows both replicas in one AZ
          whenUnsatisfiable: ScheduleAnyway        # soft rule - during an AZ outage pods still schedule instead of staying Pending
          matchLabelKeys: [pod-template-hash]      # count per ReplicaSet revision
          labelSelector:
            matchLabels:
              app: frontend                        # which pods to spread
      terminationGracePeriodSeconds: 60            # 30s preStop sleep + ~30s for httpd to exit after its stop signal
      automountServiceAccountToken: false          # httpd never calls the Kubernetes API - don't hand it a token
      securityContext:                             # pod level - applies to every container + volume in the pod
        runAsNonRoot: true                         # refuse to start if anything would run as root
        runAsUser: 10001                           # fixed non-root UID (kube-score wants > 10000 - no overlap with host users)
        runAsGroup: 10001
        fsGroup: 10001                             # emptyDirs below get group 10001 -> writable by httpd (without it: "could not create logs/httpd.pid", crash)
        seccompProfile:
          type: RuntimeDefault                     # block dangerous/unneeded kernel syscalls
      containers:
        - name: frontend
          image: "341587087009.dkr.ecr.us-east-1.amazonaws.com/calc-app-frontend:a4feae1"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080                  # non-root can't bind < 1024 - httpd.conf Listen 8080
          securityContext:                         # container level
            allowPrivilegeEscalation: false        # no setuid/sudo-style escalation
            readOnlyRootFilesystem: true           # nobody can modify files/binaries in the container - writes only to the emptyDirs
            capabilities:
              drop: ["ALL"]                        # no special Linux privileges at all
          volumeMounts:
            - name: tmp
              mountPath: /tmp                      # scratch space
            - name: httpd-logs
              mountPath: /usr/local/apache2/logs   # httpd's PID file (access/error logs go to stdout/stderr)
          startupProbe:                            # "has the app finished booting?" - readiness/liveness wait until this passes
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
            failureThreshold: 30                   # up to ~60s to boot before the container is restarted
          readinessProbe:                          # "should this pod get traffic?" - fails fast, never restarts the pod
            httpGet:
              path: /                              # the page httpd actually serves
              port: 8080
            periodSeconds: 5                       # check often...
            failureThreshold: 2                    # ...out of rotation after ~10s of failures
          livenessProbe:                           # "is the process hung?" - restarts the pod, so kept lighter and patient
            tcpSocket:
              port: 8080                           # just "is the socket accepting" - differs from readiness on purpose
            periodSeconds: 20
            failureThreshold: 3                    # restart only after ~60s unresponsive
          lifecycle:
            preStop:
              sleep:
                seconds: 30                        # keep serving while the ALB deregisters this pod, before httpd stops - covers an ALB controller leader failover (~21s measured) + ALB propagation
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 50Mi              # node disk reserved for logs + writable layer
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 250Mi             # over this, only this pod is evicted - not the whole node via DiskPressure
      volumes:                                     # the only writable paths - root filesystem is read-only
        - name: tmp
          emptyDir:
            sizeLimit: 50Mi
        - name: httpd-logs
          emptyDir:
            sizeLimit: 10Mi                        # just the PID file
---
# Limits VOLUNTARY disruptions (node drains, node group upgrades, autoscaler
# scale-down) - a drain waits here instead of evicting both replicas at once.
# Rollouts are governed by maxUnavailable above instead. Lives in this file
# because its selector must match the Deployment's labels - a PDB selecting
# nothing silently protects nothing.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: calc-app
spec:
  minAvailable: 1                                # at least 1 of the 2 replicas stays up during a drain
  unhealthyPodEvictionPolicy: AlwaysAllow        # a crash-looping pod can still be evicted - don't let it block drains
  selector:
    matchLabels:
      app: frontend                              # must match the Deployment's pod labels above
