# TEMPLATE ONLY - do not fill in real credentials and commit this file.
#
# Create the real secret imperatively instead, so credentials never touch git:
#   kubectl create secret generic backend-db-secret \
#     --namespace calc-app \
#     --from-literal=DB_USER='<your-db-user>' \
#     --from-literal=DB_PASS='<your-db-password>'
#
# This file is kept only so `kubectl apply -f k8s/` has something to diff
# against / for reference on what keys the backend Deployment expects.
apiVersion: v1
kind: Secret
metadata:
  name: backend-db-secret
  namespace: calc-app
type: Opaque
stringData:
  DB_USER: "REPLACE_ME"
  DB_PASS: "REPLACE_ME"
